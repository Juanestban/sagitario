<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Sagitario</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B1F66"/>
      <stop offset="1" stop-color="#120E33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#FFC94A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.5">
      <stop offset="0" stop-color="#FFC94A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFC94A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night sky -->
  <rect width="256" height="256" rx="56" fill="url(#sky)"/>
  <rect width="256" height="256" rx="56" fill="url(#glow)"/>

  <!-- The Sagittarius "teapot" asterism -->
  <g stroke="#B9B3FF" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <polyline points="34,74 56,52 82,60 74,86 46,96 34,74"/>
    <line x1="82" y1="60" x2="104" y2="44"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="34" cy="74" r="2.6"/>
    <circle cx="56" cy="52" r="3.2"/>
    <circle cx="82" cy="60" r="2.8"/>
    <circle cx="74" cy="86" r="2.4"/>
    <circle cx="46" cy="96" r="2.2"/>
    <circle cx="104" cy="44" r="2.6"/>
    <circle cx="214" cy="204" r="1.8" fill-opacity="0.7"/>
    <circle cx="196" cy="226" r="1.4" fill-opacity="0.6"/>
    <circle cx="30" cy="200" r="1.6" fill-opacity="0.6"/>
  </g>

  <!-- Bow and drawn string -->
  <path d="M58.5 98.5 Q186 70 157.5 197.5" fill="none" stroke="url(#gold)" stroke-width="11" stroke-linecap="round"/>
  <polyline points="58.5,98.5 90,166 157.5,197.5" fill="none" stroke="#E8E6FF" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Arrow -->
  <line x1="90" y1="166" x2="194" y2="62" stroke="#F4F2FF" stroke-width="6" stroke-linecap="round"/>
  <polygon points="214,42 180,58 198,76" fill="url(#gold)"/>
  <polygon points="112,144 92,164 78,150 94,148" fill="#FF7A59"/>
  <polygon points="112,144 92,164 106,178 108,162" fill="#FFC94A"/>
</svg>
