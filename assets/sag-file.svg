<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- The file icon of `.sag` files: the bow and arrow of the sign of Sagittarius on the night
       sky of the logo (docs/assets/logo.svg), with the cursor of a prompt. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A2A85"/>
      <stop offset="1" stop-color="#160F40"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#FFC94A"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="15" height="15" rx="3.5" fill="url(#sky)"/>
  <!-- Bow and string -->
  <path d="M2.6 6.4 Q11.4 3.9 9.6 13.4" fill="none" stroke="url(#gold)" stroke-width="1.7" stroke-linecap="round"/>
  <polyline points="2.6,6.4 5.2,10.8 9.6,13.4" fill="none" stroke="#E8E6FF" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- Arrow -->
  <line x1="4.4" y1="11.6" x2="12.6" y2="3.4" stroke="#F4F2FF" stroke-width="1.3" stroke-linecap="round"/>
  <polyline points="9.3,3.1 12.9,3.1 12.9,6.7" fill="none" stroke="#FFC94A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor -->
  <line x1="11.3" y1="12.9" x2="13.7" y2="12.9" stroke="#9EE6FF" stroke-width="1.3" stroke-linecap="round"/>
</svg>
