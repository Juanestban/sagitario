[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/Juanestban/sagitario"

[workspace.lints.rust]
unsafe_code = "forbid"

# The compiler must never panic on user input (docs/adr/0016-engineering-process.md).
# clippy.toml relaxes the panicking lints inside tests.
[workspace.lints.clippy]
dbg_macro = "warn"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"
