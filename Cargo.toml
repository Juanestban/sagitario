[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/Juanestban/sagitario"

[workspace.dependencies]
sagitario_ast = { path = "crates/sagitario_ast" }
sagitario_codegen_c = { path = "crates/sagitario_codegen_c" }
sagitario_diagnostics = { path = "crates/sagitario_diagnostics" }
sagitario_driver = { path = "crates/sagitario_driver" }
sagitario_lexer = { path = "crates/sagitario_lexer" }
sagitario_nova = { path = "crates/sagitario_nova" }
sagitario_parser = { path = "crates/sagitario_parser" }
sagitario_resolve = { path = "crates/sagitario_resolve" }
sagitario_sir = { path = "crates/sagitario_sir" }
sagitario_span = { path = "crates/sagitario_span" }
sagitario_types = { path = "crates/sagitario_types" }

[workspace.lints.rust]
unsafe_code = "forbid"

# The compiler must never panic on user input (docs/adr/0016-engineering-process.md).
# clippy.toml relaxes the panicking lints inside tests.
[workspace.lints.clippy]
dbg_macro = "warn"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"
