name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The Ubuntu runners have the Android NDK: its cross-compilation tests must not be skipped
      # there. The macOS runners have Xcode, which the iOS tests use (docs/nova.md#targets).
      SAG_REQUIRE_NDK: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The official LLVM clang, which builds with sanitizers (docs/adr/0018-windows-c-toolchain.md).
      - name: Use LLVM clang on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "SAG_CC=C:\Program Files\LLVM\bin\clang.exe" >> $env:GITHUB_ENV
      # ThreadSanitizer cannot map its shadow memory with the address randomization of recent
      # Ubuntu kernels (docs/adr/0045-threads-and-send.md).
      - name: Allow ThreadSanitizer's memory layout
        if: runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: clang --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  gcc:
    name: test (ubuntu-latest, gcc)
    runs-on: ubuntu-latest
    env:
      SAG_CC: gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ThreadSanitizer cannot map its shadow memory with the address randomization of recent
      # Ubuntu kernels (docs/adr/0045-threads-and-send.md).
      - name: Allow ThreadSanitizer's memory layout
        if: runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: gcc --version
      - run: cargo test --workspace

  # MSVC's cl, supported best-effort and without sanitizers (docs/adr/0044-c-toolchains.md).
  cl:
    name: test (windows-latest, cl)
    runs-on: windows-latest
    env:
      SAG_CC: cl
      SAG_TEST_SANITIZE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The environment of a Developer Command Prompt, for the following steps.
      - name: Set up the MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV }
          }
      - run: cl
      - run: cargo test --workspace

  # The self-hosted compiler (docs/adr/0056-bootstrap-and-acceptance.md): `sagc` built by `sag`
  # (stage 1) passes the suites, and builds a stage 2 that generates the same C for the compiler.
  bootstrap:
    name: bootstrap (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows, clang
            os: windows-latest
            cc: C:\Program Files\LLVM\bin\clang.exe
          - name: windows, cl
            os: windows-latest
            cc: cl
          # MinGW, supported best-effort and without sanitizers (docs/adr/0018-windows-c-toolchain.md).
          - name: windows, MinGW gcc
            os: windows-latest
            cc: C:\mingw64\bin\gcc.exe
          - name: ubuntu, clang
            os: ubuntu-latest
            cc: clang
          - name: ubuntu, gcc
            os: ubuntu-latest
            cc: gcc
          - name: macos, clang
            os: macos-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      SAG_CC: ${{ matrix.cc }}
      # MSVC has no UndefinedBehaviorSanitizer (docs/adr/0044-c-toolchains.md).
      SAG_TEST_SANITIZE: ${{ matrix.cc == 'cl' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The environment of a Developer Command Prompt, for the following steps.
      - name: Set up the MSVC environment
        if: matrix.cc == 'cl'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV }
          }
      # ThreadSanitizer cannot map its shadow memory with the address randomization of recent
      # Ubuntu kernels (docs/adr/0045-threads-and-send.md).
      - name: Allow ThreadSanitizer's memory layout
        if: runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28
      # The default shells: Git Bash on Windows would put its own `link.exe` (coreutils) before
      # MSVC's on PATH.
      - name: Show the C compiler
        if: matrix.cc != 'cl' && runner.os == 'Windows'
        run: '& $env:SAG_CC --version'
      - name: Show the C compiler
        if: runner.os != 'Windows'
        run: '"$SAG_CC" --version'
      - run: cargo build -p sagitario_cli
      - name: Build stage 1
        run: ./target/debug/sag build compiler/src/main.sag
      # Before the fixed point test, which writes to `compiler/src/` too.
      - name: Run the suites with stage 1
        env:
          SAG_COMPILER: ${{ github.workspace }}/compiler/src/main${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo test -p sagitario_cli --test suites
      # Nova in Sagitario, built by stage 1, runs stage 1 (docs/adr/0064-nova-in-sagitario.md).
      - name: Build Nova with stage 1
        run: ./compiler/src/main build compiler/src/nova_main.sag --output compiler/src/nova${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Run the Nova tests with Nova in Sagitario
        env:
          NOVA_BINARY: ${{ github.workspace }}/compiler/src/nova${{ runner.os == 'Windows' && '.exe' || '' }}
          SAG: ${{ github.workspace }}/compiler/src/main${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo test -p sagitario_nova --test nova
      - name: Reach the fixed point
        run: cargo test -p sagitario_cli --test selfhost bootstrap_reaches_the_fixed_point

  # The VS Code extension packages (docs/adr/0057-editor-tooling-and-independence-from-rust.md).
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run package

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
