name: Release

# A release of Sagitario on a tag `vX.Y.Z` (docs/adr/0068-releases-and-distribution.md): each
# platform bootstraps from the seed in release mode, passes the harness with what it built and
# writes its archive; the last job publishes them all, with their checksums, as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          # The official LLVM clang, with the C runtime linked statically: the executables need no
          # redistributable (docs/adr/0018-windows-c-toolchain.md).
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cc: C:\Program Files\LLVM\bin\clang.exe
          # The oldest Ubuntu runners, so that the executables need an older glibc.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            cc: clang
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            cc: clang
          - target: aarch64-apple-darwin
            os: macos-15
            cc: clang
          - target: x86_64-apple-darwin
            os: macos-15-intel
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      SAG_CC: ${{ matrix.cc }}
      # The oldest macOS the executables run on.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag is the version of Sagitario
        shell: bash
        run: |
          version=$(tr -d '\r' < compiler/Nova.toml | sed -n 's/^version = "\(.*\)"$/\1/p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not v$version, the version in compiler/Nova.toml"
            exit 1
          fi
      # ThreadSanitizer cannot map its shadow memory with the address randomization of recent
      # Ubuntu kernels (docs/adr/0045-threads-and-send.md).
      - name: Allow ThreadSanitizer's memory layout
        if: runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Show the C compiler
        if: runner.os == 'Windows'
        run: '& $env:SAG_CC --version'
      - name: Show the C compiler
        if: runner.os != 'Windows'
        run: '"$SAG_CC" --version'
      - name: Build and archive
        if: runner.os == 'Windows'
        run: ./bootstrap/build.ps1 --dist
      - name: Build and archive
        if: runner.os != 'Windows'
        run: sh bootstrap/build.sh --dist
      # What is released passes the harness, also on the platforms CI does not build on.
      - name: Run the harness with the release
        run: ./build/bin/sag run tests/harness/main.sag -- --sag build/bin/sag${{ runner.os == 'Windows' && '.exe' || '' }} --nova build/bin/nova${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            build/dist/*.zip
            build/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - name: Write the checksums
        working-directory: dist
        run: |
          sha256sum sagitario-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Sagitario ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
